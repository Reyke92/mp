<nav class="navbar navbar-expand-md bg-body py-3">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="{% url 'home' %}">
        <span class="bs-icon-sm bs-icon-rounded bs-icon-primary d-flex justify-content-center align-items-center me-2 bs-icon">
            <svg xmlns="http://www.w3.org/2000/svg"
                width="1.15em"
                height="1.15em"
                fill="currentColor"
                viewBox="0 0 16 16"
                role="img"
                aria-label="Marketplace handbag icon">
                <path d="M4.25 5.5A1.25 1.25 0 0 0 3 6.75v4.5A2.75 2.75 0 0 0 5.75 14h4.5A2.75 2.75 0 0 0 13 11.25v-4.5A1.25 1.25 0 0 0 11.75 5.5H4.25zm2-1V4a1.75 1.75 0 1 1 3.5 0v.5h-1.5V4a.25.25 0 1 0-.5 0v.5h-1.5z"/>
            </svg>
        </span>
            <span>Marketplace</span>
        </a>

        <button
            class="btn btn-outline-primary me-3"
            id="toggle-categories-sidebar-btn"
            type="button"
            data-bs-target="#offcanvas-menu"
            data-bs-toggle="offcanvas"
            aria-controls="offcanvas-menu"
            aria-label="Browse categories"
        >
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 16 16" class="bi bi-list fs-4">
                <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"></path>
            </svg>
        </button>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navcol-2" aria-controls="navcol-2" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navcol-2">
            <form
                class="navbar-search-form d-flex flex-column flex-md-row align-items-stretch align-items-md-center gap-2 me-md-3"
                method="get"
                action="{% url 'search' %}"
                role="search"
            >
                <label class="visually-hidden" for="navbar-search-box">Search Marketplace listings</label>
                <input
                    class="form-control"
                    type="search"
                    id="navbar-search-box"
                    name="q"
                    value="{{ request.GET.q|default:'' }}"
                    placeholder="Search Marketplace"
                    aria-label="Search Marketplace listings"
                >
                <button class="btn btn-primary" id="search-btn" type="submit">Browse</button>
            </form>

            <div class="d-flex flex-column flex-md-row align-items-stretch align-items-md-center gap-2 ms-auto navbar-actions">
                {% if not user.is_authenticated %}
                    <a class="btn btn-primary" role="button" id="login-btn" href="{% url 'login' %}">Login</a>
                    <a class="btn btn-primary" role="button" id="register-btn" href="{% url 'register' %}">Register</a>
                {% else %}
                    <form method="post" action="{% url 'logout' %}" class="d-inline">
                        {% csrf_token %}
                        <button class="btn btn-primary" id="logout-btn" type="submit">Logout</button>
                    </form>

                    <a
                        id="user-profile-link"
                        class="navbar-avatar-link"
                        href="{% url 'profile' %}"
                        aria-label="Open your profile"
                    >
                        {% if profile and profile.avatar %}
                            <img
                                class="navbar-avatar rounded-circle bg-info"
                                src="{{ profile.avatar.url }}"
                                alt="Your profile avatar"
                                width="40"
                                height="40"
                            >
                        {% else %}
                            <span class="navbar-avatar navbar-avatar-placeholder rounded-circle" aria-hidden="true">
                                {{ user.username|default:user.email|slice:":1"|upper }}
                            </span>
                        {% endif %}
                    </a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>
