name: Django CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: django-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-suites:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Unit Tests
            dotted_path: tests.unit
            folder_path: tests/unit

          - name: Integration Tests
            dotted_path: tests.integration
            folder_path: tests/integration

          - name: Security Tests
            dotted_path: tests.security
            folder_path: tests/security

          - name: System Tests
            dotted_path: tests.system
            folder_path: tests/system

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpasswd
          MYSQL_DATABASE: mp_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpasswd --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_NAME: mp_db
      DB_USER: root
      DB_PASSWORD: rootpasswd
      DB_HOST: 127.0.0.1
      DB_PORT: 3306

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev default-libmysqlclient-dev build-essential pkg-config default-mysql-client

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for MySQL
        shell: bash
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -prootpasswd --silent; then
              echo "MySQL is reachable."
              exit 0
            fi

            echo "Waiting for MySQL..."
            sleep 2
          done

          echo "MySQL did not become reachable in time."
          exit 1

      - name: Run ${{ matrix.name }}
        shell: bash
        run: |
          if [ -d "${{ matrix.folder_path }}" ]; then
            python manage.py test ${{ matrix.dotted_path }} --verbosity=2
          else
            echo "Directory '${{ matrix.folder_path }}' not found. Skipping ${{ matrix.name }}."
          fi